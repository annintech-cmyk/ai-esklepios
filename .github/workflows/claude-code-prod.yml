name: Claude Code (Production)

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-code-prod:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code (Production)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_PROD }}
          # Production uses more comprehensive analysis
          model: claude-3-5-opus

      - name: Run All Tests
        run: |
          ./gradlew :shared:commonTest
          ./gradlew :androidApp:test
          xcodebuild test \
            -project iosApp/eSklepios.xcodeproj \
            -scheme eSklepios \
            -destination 'platform=iOS Simulator,name=iPhone 16'

      - name: Security Lint
        run: |
          ./gradlew :androidApp:lint
          ./gradlew :shared:detekt
          ./gradlew :shared:dependencyCheck

      - name: Build Release APK
        run: |
          ./gradlew :androidApp:assembleRelease

      - name: Build iOS Archive
        run: |
          xcodebuild archive \
            -project iosApp/eSklepios.xcodeproj \
            -scheme eSklepios \
            -archivePath build/eSklepios.xcarchive

      - name: Comment on PR (Production)
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Claude Code (Prod) security analysis completed. All tests passed. Ready for merge.'
            })
