name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  JAVA_DISTRO: "temurin"
  XCODE_DESTINATION: "platform=iOS Simulator,name=iPhone 16"

jobs:

  # ─────────────────────────────────────────────
  # 1. Validate (lightweight guardrails only)
  # ─────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block direct pushes to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "::error::Direct pushes to main are not allowed."
          exit 1

      - name: Check branch naming
        if: github.event_name == 'pull_request'
        run: |
          BRANCH="${{ github.head_ref }}"
          PATTERN='^(feat|fix|hotfix|refactor|chore|docs|test|perf|ci)/'
          if ! echo "$BRANCH" | grep -qE "$PATTERN"; then
            echo "::warning::Branch does not follow convention"
          fi

  # ─────────────────────────────────────────────
  # 2. Kotlin Lint (fast feedback)
  # ─────────────────────────────────────────────
  kotlin-lint:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v3

      - name: Detekt
        run: ./gradlew detekt

      - name: KtLint
        run: ./gradlew ktlintCheck

  # ─────────────────────────────────────────────
  # 3. Shared KMP tests (IMPORTANT FIX HERE)
  # ─────────────────────────────────────────────
  shared-tests:
    runs-on: ubuntu-latest
    needs: kotlin-lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v3

      - name: Run KMP tests (correct way)
        run: ./gradlew allTests

  # ─────────────────────────────────────────────
  # 4. Android pipeline
  # ─────────────────────────────────────────────
  android-build:
    runs-on: ubuntu-latest
    needs: shared-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v3

      - name: Lint
        run: ./gradlew :androidApp:lintDebug

      - name: Unit tests
        run: ./gradlew :androidApp:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-artifacts
          path: |
            androidApp/build/outputs/
            androidApp/build/reports/

  # ─────────────────────────────────────────────
  # 5. iOS pipeline (KMP best practice version)
  # ─────────────────────────────────────────────
  ios-build:
    runs-on: macos-14
    needs: shared-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v3

      # Cache XCFramework (safe keying)
      - name: Cache XCFramework
        uses: actions/cache@v4
        with:
          path: shared/build/XCFrameworks
          key: xcframework-${{ hashFiles('shared/**', 'gradle.properties', 'settings.gradle.kts') }}

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging

      - name: Build XCFramework (KMP output)
        run: ./gradlew :shared:assembleXCFramework

      # IMPORTANT: single xcodebuild run, no duplication
      - name: iOS tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project iosApp/eSklepios.xcodeproj \
            -scheme eSklepios \
            -destination "${{ env.XCODE_DESTINATION }}" \
            -resultBundlePath build/ios-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-test-results
          path: build/ios-tests.xcresult

  # ─────────────────────────────────────────────
  # 6. Release gate (clean + deterministic)
  # ─────────────────────────────────────────────
  release-build:
    runs-on: ubuntu-latest
    needs: [android-build, ios-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v3

      - name: Android release build
        run: ./gradlew :androidApp:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: androidApp/build/outputs/apk/release/