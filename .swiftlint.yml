# .swiftlint.yml — eSklepios SwiftLint configuration
# Enforce iOS coding standards and project rules.

included:
  - iosApp/eSklepios

excluded:
  - iosApp/eSklepios.xcodeproj
  - iosApp/eSklepiosTests
  - build/

# ─── Rules that would cause CI failure ────────────────────────────────────────
opt_in_rules:
  - array_init
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - convenience_type
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_header
  - first_where
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_function_chains
  - multiline_parameters
  - nimble_operator
  - nslocalizedstring_key
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - raw_value_for_camel_cased_codable_enum
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - single_test_class
  - sorted_first_last
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - yoda_condition

disabled_rules:
  - todo               # managed by pre-commit hook
  - trailing_whitespace
  - multiple_closures_with_trailing_closure

# ─── Thresholds ───────────────────────────────────────────────────────────────
line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 500

function_parameter_count:
  warning: 8
  error: 10

# ─── Naming ───────────────────────────────────────────────────────────────────
type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60
  excluded:
    - ID

identifier_name:
  min_length:
    error: 2
  excluded:
    - id
    - x
    - y

# ─── Project-specific rule configs ────────────────────────────────────────────
force_cast: error
force_try: error
force_unwrapping: warning

# Rule UI-10: No force unwrap in Views
# (enforced as warning here; pre-commit hook also flags these)

# DispatchQueue.main.async is forbidden in ViewModelWrappers (Rule FW-2)
# Detected by custom_rules below.

custom_rules:
  dispatch_queue_main:
    name: "DispatchQueue.main.async forbidden in ViewModelWrappers"
    regex: 'DispatchQueue\.main\.async'
    included: ".*ViewModelWrapper\\.swift"
    message: "Use Task { @MainActor in } instead of DispatchQueue.main.async (Rule FW-2)"
    severity: error

  hardcoded_color_hex:
    name: "Hardcoded color hex"
    regex: 'Color\(red:\s*\d|\.init\(red:\s*\d|#[0-9A-Fa-f]{6}'
    message: "Use design token from AppColors.swift instead of hardcoded color (Rule UI-3)"
    severity: warning

  hardcoded_url:
    name: "Hardcoded URL in source"
    regex: '"https?://[^"]{10,}"'
    excluded: ".*AppUrls\\.swift|.*Tests\\.swift"
    message: "Use AppUrls centralised URL constants instead of hardcoded strings"
    severity: warning

  inline_date_formatter:
    name: "Inline DateFormatter"
    regex: 'DateFormatter\(\)'
    excluded: ".*DateUtil\\.swift"
    message: "Use DateUtil.swift for all date formatting (Rule DT-5)"
    severity: error

  todo_fixme:
    name: "Unresolved TODO/FIXME"
    regex: '(TODO|FIXME|HACK):'
    message: "Resolve or track this before merging to main"
    severity: warning

  no_print_production:
    name: "Debug print in production code"
    regex: '^\s*print\('
    excluded: ".*Tests\\.swift"
    message: "Remove debug print() before committing (Rule LOG-1)"
    severity: warning

  mainactor_required_on_wrapper:
    name: "@MainActor required on ViewModelWrapper"
    regex: 'class \w+ViewModelWrapper'
    message: "ViewModelWrapper classes must be annotated @MainActor (Rule FW-1)"
    severity: warning
