  # .swiftlint.yml — eSklepios SwiftLint configuration

  included:
    - iosApp/eSklepios

  excluded:
    - iosApp/eSklepios.xcodeproj
    - iosApp/eSklepiosTests
    - iosApp/eSklepiosUITests
    - Pods
    - build/

  # ──────────────────────────────────────────────────────────────────────────────
  # Analyzer rules
  # ──────────────────────────────────────────────────────────────────────────────

  analyzer_rules:
    - unused_import

  # ──────────────────────────────────────────────────────────────────────────────
  # Opt-in rules
  # ──────────────────────────────────────────────────────────────────────────────

  opt_in_rules:
    - array_init
    - closure_spacing
    - collection_alignment
    - contains_over_filter_count
    - contains_over_filter_is_empty
    - contains_over_first_not_nil
    - convenience_type
    - discouraged_object_literal
    - empty_collection_literal
    - empty_count
    - empty_string
    - enum_case_associated_values_count
    - explicit_init
    - fallthrough
    - fatal_error_message
    - file_header
    - first_where
    - flatmap_over_map_reduce
    - identical_operands
    - joined_default_parameter
    - last_where
    - legacy_random
    - literal_expression_end_indentation
    - lower_acl_than_parent
    - modifier_order
    - multiline_arguments
    - multiline_function_chains
    - multiline_literal_brackets
    - multiline_parameters
    - nimble_operator
    - nslocalizedstring_key
    - object_literal
    - operator_usage_whitespace
    - overridden_super_call
    - pattern_matching_keywords
    - prefer_self_type_over_type_of_self
    - prefer_zero_over_explicit_init
    - private_action
    - private_outlet
    - prohibited_super_call
    - quick_discouraged_call
    - quick_discouraged_focused_test
    - quick_discouraged_pending_test
    - raw_value_for_camel_cased_codable_enum
    - reduce_into
    - redundant_nil_coalescing
    - redundant_type_annotation
    - single_test_class
    - sorted_first_last
    - static_operator
    - strong_iboutlet
    - switch_case_on_newline
    - toggle_bool
    - unavailable_function
    - unneeded_parentheses_in_closure_argument
    - untyped_error_in_catch
    - vertical_parameter_alignment_on_call
    - vertical_whitespace_closing_braces
    - yoda_condition

  # ──────────────────────────────────────────────────────────────────────────────
  # Disabled rules
  # ──────────────────────────────────────────────────────────────────────────────

  disabled_rules:
    - todo
    - trailing_whitespace
    - multiple_closures_with_trailing_closure

    # Optional relaxations for large SwiftUI codebases
    # Uncomment only if needed

    # - cyclomatic_complexity
    # - function_parameter_count
    # - identifier_name
    # - opening_brace
    # - type_name
    # - void_function_in_ternary
    # - class_delegate_protocol

  # ──────────────────────────────────────────────────────────────────────────────
  # Thresholds
  # ──────────────────────────────────────────────────────────────────────────────

  line_length:
    warning: 160
    error: 220
    ignores_comments: true
    ignores_urls: true

  file_length:
    warning: 800
    error: 1200

  function_body_length:
    warning: 100
    error: 150

  type_body_length:
    warning: 400
    error: 1200

  function_parameter_count:
    warning: 8
    error: 10

  # ──────────────────────────────────────────────────────────────────────────────
  # Rule severity configuration
  # ──────────────────────────────────────────────────────────────────────────────

  multiline_arguments:
    severity: error

  collection_alignment:
    severity: error

  for_where:
    severity: error

  # ──────────────────────────────────────────────────────────────────────────────
  # Naming
  # ──────────────────────────────────────────────────────────────────────────────

  type_name:
    min_length: 3
    max_length:
      warning: 60
      error: 100
    excluded:
      - ID

  identifier_name:
    min_length:
      error: 2
    excluded:
      - id
      - x
      - y

  # ──────────────────────────────────────────────────────────────────────────────
  # Project-specific rule configs
  # ──────────────────────────────────────────────────────────────────────────────

  force_cast: error
  force_try: error
  force_unwrapping: warning

  # ──────────────────────────────────────────────────────────────────────────────
  # Custom Rules
  # ──────────────────────────────────────────────────────────────────────────────

  custom_rules:

    dispatch_queue_main:
      name: "DispatchQueue.main.async forbidden in ViewModelWrappers"
      regex: 'DispatchQueue\.main\.async'
      included: ".*ViewModelWrapper\\.swift"
      message: "Use Task { @MainActor in } instead of DispatchQueue.main.async (Rule FW-2)"
      severity: error

    hardcoded_color_hex:
      name: "Hardcoded color hex"
      regex: 'Color\(red:\s*\d|\.init\(red:\s*\d|#[0-9A-Fa-f]{6}'
      message: "Use design token from AppColors.swift instead of hardcoded color (Rule UI-3)"
      severity: warning

    hardcoded_url:
      name: "Hardcoded URL in source"
      regex: '"https?://[^"]{10,}"'
      excluded: ".*AppUrls\\.swift|.*Tests\\.swift"
      message: "Use AppUrls centralized URL constants instead of hardcoded strings"
      severity: warning

    inline_date_formatter:
      name: "Inline DateFormatter"
      regex: 'DateFormatter\(\)'
      excluded: ".*DateUtil\\.swift"
      message: "Use DateUtil.swift for all date formatting (Rule DT-5)"
      severity: error

    todo_fixme:
      name: "Unresolved TODO/FIXME"
      regex: '(TODO|FIXME|HACK):'
      message: "Resolve or track this before merging to main"
      severity: warning

    no_print_production:
      name: "Debug print in production code"
      regex: '^\s*print\('
      excluded: ".*Tests\\.swift"
      message: "Remove debug print() before committing (Rule LOG-1)"
      severity: warning

    mainactor_required_on_wrapper:
      name: "@MainActor required on ViewModelWrapper"
      regex: 'class \w+ViewModelWrapper'
      message: "ViewModelWrapper classes must be annotated @MainActor (Rule FW-1)"
      severity: warning

